name: Daily BollywoodEdge Publish

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run publish script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node publish.js

      - name: Commit and push new article
        run: |
          git config user.name "BollywoodEdge Bot"
          git config user.email "filmtabela@gmail.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-publish: $(date +'%Y-%m-%d')"
          git push
