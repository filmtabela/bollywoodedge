name: BollywoodEdge Daily Publisher

on:
  schedule:
    - cron: '30 3 * * 1,3,5'   # 9:00 AM IST, Mon/Wed/Fri (cut from daily 19-Oct-2026)
  push:
    branches: [main]
    paths: ['publish.js', '.github/workflows/publish.yml']
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate and publish article (commits and pushes itself)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node publish.js
